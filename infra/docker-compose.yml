name: second-brain

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: second_brain
      POSTGRES_USER: second_brain
      POSTGRES_PASSWORD: second_brain
    ports:
      - "${SECOND_BRAIN_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U second_brain -d second_brain"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sb-mcp-server
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SECOND_BRAIN_DB_DSN: postgresql://second_brain:second_brain@postgres:5432/second_brain
      SECOND_BRAIN_MCP_TRANSPORT: streamable-http
      SECOND_BRAIN_MCP_HOST: 0.0.0.0
      SECOND_BRAIN_MCP_PORT: 8000
      SECOND_BRAIN_MCP_STREAMABLE_HTTP_PATH: /mcp
    ports:
      - "${SECOND_BRAIN_MCP_BIND_PORT:-18000}:8000"
    volumes:
      - /Users/davidmcnabb/projects:/Users/davidmcnabb/projects:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sb-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SECOND_BRAIN_DB_DSN: postgresql://second_brain:second_brain@postgres:5432/second_brain
      SECOND_BRAIN_API_PORT: 8090
      SECOND_BRAIN_FRONTEND_DIST_DIR: /app/apps/web/dist
    command: ["python", "-m", "second_brain_api.cli", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "${SECOND_BRAIN_API_BIND_PORT:-18090}:8090"
    volumes:
      - /Users/davidmcnabb/projects:/Users/davidmcnabb/projects:ro
    depends_on:
      postgres:
        condition: service_healthy

  ingester-watch:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sb-ingester-watch
    cpus: 0.50
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SECOND_BRAIN_DB_DSN: postgresql://second_brain:second_brain@postgres:5432/second_brain
      SECOND_BRAIN_WATCH_INTERVAL_SECONDS: "60"
    command: ["python", "-m", "second_brain_ingester.cli", "watch-files"]
    volumes:
      - /Users/davidmcnabb/projects:/Users/davidmcnabb/projects:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
